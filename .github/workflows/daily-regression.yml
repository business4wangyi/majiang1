name: Daily Regression

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGRESSION_DYNAMIC_SKIP: "1"

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore regression baseline
        uses: actions/cache/restore@v4
        with:
          path: .agents/automation-memory/daily-regression
          key: daily-regression-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            daily-regression-${{ runner.os }}-

      - name: Run daily regression
        id: regression
        run: |
          set +e
          npm run regression:daily
          exit_code=$?
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish regression summary
        if: always()
        run: cat logs/daily-regression-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-regression-report
          path: |
            logs/daily-regression-report.md
            .agents/automation-memory/daily-regression/latest.json

      - name: Save regression baseline
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .agents/automation-memory/daily-regression
          key: daily-regression-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Fail on regression errors
        if: always()
        run: exit "${{ steps.regression.outputs.exit_code }}"
