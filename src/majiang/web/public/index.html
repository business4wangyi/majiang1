<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>麻将首版 UI</title>
  <link rel="icon" href="/majiang-web/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/majiang-web/styles.css" />
</head>
<body>
  <div class="page-shell">
    <section id="lobby" class="panel lobby-panel" data-testid="majiang-lobby">
      <div class="hero">
        <p class="eyebrow">Majiang MVP</p>
        <h1>麻将 Web 牌桌</h1>
        <p class="subtitle">首版只保留本地单机核心流程：1 人 + 3 AI。</p>
      </div>
      <div class="lobby-actions">
        <fieldset class="mode-picker" aria-label="选择对局模式" data-testid="mode-picker">
          <legend>选择模式</legend>
          <label class="mode-card">
            <input type="radio" name="game-mode" value="manual" checked data-testid="mode-manual" />
            <span>
              <span class="mode-title">手动模式</span>
              <span class="mode-value">1 人 + 3 AI，可开始</span>
            </span>
          </label>
          <label class="mode-card disabled">
            <input type="radio" name="game-mode" value="auto-demo" disabled data-testid="mode-auto-demo" />
            <span>
              <span class="mode-title">自动演示模式</span>
              <span class="mode-value">暂未开放，待 session tick 方案明确</span>
            </span>
          </label>
        </fieldset>
        <button id="start-btn" class="primary-btn" data-testid="start-game">开始新对局</button>
      </div>
    </section>

    <section id="table" class="table-screen hidden" data-testid="majiang-table">
      <div class="table-stage">
        <div class="table-stage-frame">
          <div class="table-felt">
            <header class="table-header">
              <div>
                <p class="eyebrow">桌面状态</p>
                <h2>麻将牌桌</h2>
                <p id="status-banner" class="status-banner hidden" role="status" aria-live="polite" data-testid="status-banner"></p>
              </div>
              <div class="meta-grid">
                <div><span>当前阶段</span><strong id="game-state">-</strong></div>
                <div><span>当前行动</span><strong id="current-player">-</strong></div>
                <div><span>庄家</span><strong id="banker-player">-</strong></div>
                <div><span>圈数</span><strong id="wind-round">-</strong></div>
                <div><span>摸牌次数</span><strong id="draw-count">-</strong></div>
                <div><span>剩余牌数</span><strong id="remaining-tiles">-</strong></div>
                <div><span>当前提示</span><strong id="current-prompt">-</strong></div>
              </div>
            </header>

            <main class="table-layout">
              <section class="opponent-row">
                <div id="seat-top" class="seat" data-testid="seat-top"></div>
              </section>

              <section class="middle-row">
                <div id="seat-left" class="seat side-seat" data-testid="seat-left"></div>
                <div class="desk">
                  <div class="center-plate" aria-hidden="true">
                    <div class="center-plate-inner">
                      <span class="center-wind" id="center-wind">东</span>
                      <span class="center-round" id="center-round">1</span>
                    </div>
                  </div>
                  <div id="discard-pools" class="discard-pools"></div>
                </div>
                <div id="seat-right" class="seat side-seat" data-testid="seat-right"></div>
              </section>

              <section class="opponent-row">
                <div id="seat-bottom" class="seat player-seat" data-testid="seat-human"></div>
              </section>
            </main>

            <section class="footer-panel">
              <p class="eyebrow">操作说明</p>
              <p id="table-hint" class="table-hint" data-testid="table-hint">点击“开始新对局”后，轮到你时可直接点击手牌出牌；若出现吃/碰/杠/胡/过按钮，则表示当前需要你对上一张弃牌做响应。</p>
            </section>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="result-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="result-title" data-testid="result-modal">
    <div class="modal-card">
      <p class="eyebrow">Result</p>
      <h3 id="result-title">对局结束</h3>
      <p id="result-detail" class="result-detail">-</p>
      <p id="result-score">-</p>
      <div class="modal-actions">
        <button id="restart-btn" class="primary-btn" data-testid="restart-game">再来一局</button>
      </div>
    </div>
  </div>

  <script src="/majiang-web/app.js"></script>
</body>
</html>
